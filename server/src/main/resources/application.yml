server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8

spring:
  application:
    name: kaoyan408-server
  mvc:
    # 未匹配到端点时抛 NoResourceFoundException，由 GlobalExceptionHandler 转成统一 404 文案
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/kaoyan_db?characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  mybatis-plus:
    configuration:
      map-underscore-to-field-name: true
      map-underscore-to-method-name: true
      cache-enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline: true
    baseline-on-migrate: true

logging:
  level:
    com.kaoyan408: INFO

jwt:
  secret: ${JWT_SECRET:kaoyan408-local-dev-secret-change-before-launch}
  expire-seconds: ${JWT_EXPIRE_SECONDS:7200}
