server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 8m;

    # 传输压缩。实测未开启前：/api/v1/practice/queue?scope=all 单次 197,492 字节，
    # index.css 80,506 字节，且部署链路要穿隧道（单趟 600–1000ms），
    # 这两份体积会直接变成用户等待。开启后同一接口约 25KB。
    # 只压文本类：图片/字体本身已压缩，再 gzip 只浪费 CPU。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    # 注意不要加 text/html：nginx 对 text/html 默认总是压缩，重复声明无害但没必要。
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # server 级：所有没有自带 add_header 的 location 继承这一组安全头
    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    # 题目配图（挂载自 client/public/exams）
    location /exams/ {
        alias /usr/share/nginx/html/exams/;
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 只读内容接口：知识树 / 知识点正文 / 真题卷。
    #
    # 这些数据只随部署变化、不随用户变化（KnowledgeController 里没有任何
    # Authentication / userId，questionCount 也是全局计数），所以可以缓存。
    # 后端默认输出 no-cache, no-store（Spring Security 的 CacheControl 默认值），
    # 导致浏览器每次都要完整走一遍网络——而这条链路要穿过隧道到校园网，
    # 单次往返 400ms 起，重复拉取完全是浪费。
    #
    # 这里用 proxy_hide_header 摘掉后端的头再加自己的，是 nginx 覆盖
    # 上游 Cache-Control 的唯一正确做法（add_header 不会覆盖同名头，只会追加）。
    #
    # 300 秒的取舍：内容改完重新部署后，最迟 5 分钟生效。
    # 需要立刻生效就在 Cloudflare 后台清一次缓存。
    location ~ ^/api/v1/(knowledge|exams)(/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://api:8080;
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        # 不加 always：只对 2xx/3xx 生效。
        # 否则 5xx 也会带上 max-age=300，一次临时故障会被浏览器缓存 5 分钟。
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300";
    }

    # 知识块内联资源（图片 / 内联 SVG）。
    # 用 ^~ 抢在下面的正则 location 之前命中：正则 location 优先级高于普通前缀匹配，
    # 不加 ^~ 的话会被 ^/api/v1/(knowledge|exams) 那条接走，套上 max-age=300。
    # 这里的 URL 自带内容指纹（?v=hash），可以放心长缓存。
    location ^~ /api/v1/knowledge/asset/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://api:8080;
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        include /etc/nginx/snippets/security-headers.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 后端接口：变量形式 + 显式 $request_uri，避免容器重建后 IP 变化导致 502
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://api:8080;
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 前端为 hash 路由，静态资源缺失时回落到首页即可
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物：文件名随内容变化，可以长期缓存。
    # 注意这里不能再用 try_files 回落到 index.html——一旦 chunk 不存在，
    # 回落会让浏览器拿到 text/html 却当 JS 解析，报
    # "Expected a JavaScript module script but served text/html"，整页白屏。
    # 明确返回 404，让问题暴露出来而不是变成一个难以排查的白屏。
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 绝不能缓存：它引用的是带哈希的 chunk 文件名，
    # 一旦缓存了旧版，dist 更新后就会去请求已经不存在的 chunk，导致白屏。
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        #
        # 入口 HTML 允许**边缘缓存 60 秒**（s-maxage），浏览器端仍是 max-age=0 必回源校验。
        #
        # 为什么不再用 no-store：线上入口经 Cloudflare，no-store 意味着每次访问都要
        # 跨境回源取一次 HTML（实测单程 0.4–1.6 秒），而 HTML 只是引用带哈希的 chunk。
        # 60 秒的边缘缓存能把这段往返省掉，代价是发版后最多 60 秒才全量生效
        # （stale-while-revalidate 让过期后的第一个访客拿到旧页、后台刷新）。
        # 真要立刻生效，在 Cloudflare 后台清一次缓存即可。
        add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=300";
        # 不再用 expires -1：它自己会额外写一条 Cache-Control: no-cache，覆盖上面这条。
    }

    # 其它根级静态文件（favicon 等）：短缓存，保证更新能及时生效
    location ~* ^/[^/]+\.(svg|ico|png|webp|txt|json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}