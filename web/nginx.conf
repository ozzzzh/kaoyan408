server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 8m;

    root /usr/share/nginx/html;
    index index.html;

    # 题目配图（挂载自 client/public/exams）
    location /exams/ {
        alias /usr/share/nginx/html/exams/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 只读内容接口：知识树 / 知识点正文 / 真题卷。
    #
    # 这些数据只随部署变化、不随用户变化（KnowledgeController 里没有任何
    # Authentication / userId，questionCount 也是全局计数），所以可以缓存。
    # 后端默认输出 no-cache, no-store（Spring Security 的 CacheControl 默认值），
    # 导致浏览器每次都要完整走一遍网络——而这条链路要穿过隧道到校园网，
    # 单次往返 400ms 起，重复拉取完全是浪费。
    #
    # 这里用 proxy_hide_header 摘掉后端的头再加自己的，是 nginx 覆盖
    # 上游 Cache-Control 的唯一正确做法（add_header 不会覆盖同名头，只会追加）。
    #
    # 300 秒的取舍：内容改完重新部署后，最迟 5 分钟生效。
    # 需要立刻生效就在 Cloudflare 后台清一次缓存。
    location ~ ^/api/v1/(knowledge|exams)(/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://api:8080;
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        # 不加 always：只对 2xx/3xx 生效。
        # 否则 5xx 也会带上 max-age=300，一次临时故障会被浏览器缓存 5 分钟。
        add_header Cache-Control "public, max-age=300";
    }

    # 后端接口：变量形式 + 显式 $request_uri，避免容器重建后 IP 变化导致 502
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://api:8080;
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 前端为 hash 路由，静态资源缺失时回落到首页即可
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物：文件名随内容变化，可以长期缓存。
    # 注意这里不能再用 try_files 回落到 index.html——一旦 chunk 不存在，
    # 回落会让浏览器拿到 text/html 却当 JS 解析，报
    # "Expected a JavaScript module script but served text/html"，整页白屏。
    # 明确返回 404，让问题暴露出来而不是变成一个难以排查的白屏。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 绝不能缓存：它引用的是带哈希的 chunk 文件名，
    # 一旦缓存了旧版，dist 更新后就会去请求已经不存在的 chunk，导致白屏。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # 其它根级静态文件（favicon 等）：短缓存，保证更新能及时生效
    location ~* ^/[^/]+\.(svg|ico|png|webp|txt|json)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}