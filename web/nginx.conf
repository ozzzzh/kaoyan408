server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 8m;

    root /usr/share/nginx/html;
    index index.html;

    # 题目配图（挂载自 client/public/exams）
    location /exams/ {
        alias /usr/share/nginx/html/exams/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 后端接口：变量形式 + 显式 $request_uri，避免容器重建后 IP 变化导致 502
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://api:8080;
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 前端为 hash 路由，静态资源缺失时回落到首页即可
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物：文件名随内容变化，可以长期缓存。
    # 注意这里不能再用 try_files 回落到 index.html——一旦 chunk 不存在，
    # 回落会让浏览器拿到 text/html 却当 JS 解析，报
    # "Expected a JavaScript module script but served text/html"，整页白屏。
    # 明确返回 404，让问题暴露出来而不是变成一个难以排查的白屏。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 绝不能缓存：它引用的是带哈希的 chunk 文件名，
    # 一旦缓存了旧版，dist 更新后就会去请求已经不存在的 chunk，导致白屏。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # 其它根级静态文件（favicon 等）：短缓存，保证更新能及时生效
    location ~* ^/[^/]+\.(svg|ico|png|webp|txt|json)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}