# 安全响应头（被 web/nginx.conf 的 server 与各 location include）
#
# 为什么单独一个文件：nginx 的 add_header 是「就近覆盖」语义——只要某个 location
# 自己写了任何一条 add_header，父级（server 块）的 add_header 就全都不再继承。
# 本站的 /assets/、/api/v1/(knowledge|exams)、/exams/、= /index.html 都各自带了
# Cache-Control，所以必须逐处 include，否则这些路径会悄悄丢掉安全头。
#
# 注意：HSTS 不在这里下发。线上入口是网关终止 TLS（CloudStudio Gateway），
# 由入口层配置更准确；在源站写死 HSTS 反而会在「用 IP:端口 直连」时把用户锁死。

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# CSP。逐条说明为什么这样定：
#   script-src 'self'            无内联脚本（首帧主题预设在 public/theme-init.js，同源外链）
#   style-src  'unsafe-inline'   KaTeX 与 Tailwind 的任意值类会产生内联 style 属性，必须放行
#   img-src    data: blob:       知识点里的 base64 配图与 manim 画布
#   font-src   data:            KaTeX 字体来自本域，data: 兜底
#   worker-src blob:            manim-web 用 Blob 起 Worker
#   object-src 'none'           不加载任何插件内容
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
