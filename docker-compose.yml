services:
  # 前端静态站 + /api 反向代理
  # 端口默认 18080，避免与本机开发用的 8080 后端冲突；
  # 部署时可用 .env 的 WEB_PORT 覆盖。
  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-18080}:80"
    volumes:
      # 必须覆盖镜像自带的 default.conf，而不是并排新增一个 .conf：
      # 官方 nginx 镜像的 default.conf 同样声明 listen 80 / server_name _，
      # 两个 server 块条件完全相同时 nginx 只采用**先加载**的那个，
      # 结果是 /api/ 反代规则被绕过、请求被当成静态文件返回 404。
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
      - ./client/public/exams:/usr/share/nginx/html/exams:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: ./server
    expose:
      - "8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: "jdbc:mysql://db:3306/kaoyan_db?characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
      DB_USER: kaoyan
      DB_PASSWORD: "${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}"
      JWT_EXPIRE_SECONDS: "604800"
      # 部署地址必须显式加入 CORS 白名单，否则浏览器发起的 POST 会被判为跨域并返回 403。
      # 本地 localhost / 127.0.0.1 已在代码里默认放行；这里填实际访问地址，
      # 多个用逗号分隔，例如：http://10.0.219.241:17073,https://your.domain
      KAOYAN_CORS_ORIGINS: "${CORS_ORIGINS:-}"
      # 邮件（注册验证码）。必须在这里显式声明：容器只认 environment 里列出的变量，
      # .env 中的值不会自动注入。默认 mock 模式（验证码打印到日志），
      # 配置了 SPRING_MAIL_HOST 等四项后即为真实投递。
      MAIL_MODE: "${MAIL_MODE:-mock}"
      SPRING_MAIL_HOST: "${SPRING_MAIL_HOST:-}"
      SPRING_MAIL_PORT: "${SPRING_MAIL_PORT:-465}"
      SPRING_MAIL_USERNAME: "${SPRING_MAIL_USERNAME:-}"
      SPRING_MAIL_PASSWORD: "${SPRING_MAIL_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      # AI 学习助手。同样必须在这里显式声明，否则容器里读不到。
      # 不填 api-key 时页面仍可打开，只是对话会提示未配置。
      KAOYAN_AI_API_KEY: "${KAOYAN_AI_API_KEY:-}"
      KAOYAN_AI_MODEL: "${KAOYAN_AI_MODEL:-deepseek/deepseek-v4.1-flash}"
      KAOYAN_AI_MAX_TOKENS: "${KAOYAN_AI_MAX_TOKENS:-2000}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}"
      MYSQL_DATABASE: kaoyan_db
      MYSQL_USER: kaoyan
      MYSQL_PASSWORD: "${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}"
    # 数据库默认映射到 33061（本机开发用的 3306 常被占用，避免冲突）。
    # 不需要从宿主机连库时，可在 .env 里设 DB_PORT= 留空并注释掉这段。
    ports:
      - "${DB_PORT:-33061}:3306"
    volumes:
      - kaoyan_db_data:/var/lib/mysql
    healthcheck:
      # 用 root 探测：MYSQL_USER 在初始化完成前可能尚不可用
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  kaoyan_db_data: