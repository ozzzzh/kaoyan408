<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="题知链 三节相扣 反白">
  <!-- 反白图形：深色底使用；两端白环、中环青绿；中环在最上，两端白环被中环外圆裁切（mask） -->
  <defs>
    <mask id="cutL" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff"/>
      <circle cx="12" cy="12" r="5.9" fill="#000"/>
    </mask>
  </defs>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.887" mask="url(#cutL)">
    <circle cx="17.39" cy="6.61" r="4.457"/>
    <circle cx="6.61" cy="17.39" r="4.457"/>
  </g>
  <circle cx="12" cy="12" r="4.457" fill="none" stroke="#00B5A8" stroke-width="2.887"/>
</svg>
