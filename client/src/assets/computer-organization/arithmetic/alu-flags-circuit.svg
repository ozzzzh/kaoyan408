<svg xmlns="http://www.w3.org/2000/svg" width="2044" height="842" viewBox="0 0 2044 842" role="img" aria-labelledby="title desc">
  <title id="title">带标志位输出的加减法器电路</title>
  <desc id="desc">SUB 控制 B 或 B 反相量经过多路选择器进入加法器，同时作为最低位进位 Cin；加法器输出 F、ZF、OF、SF、CF 与 Cout。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="2044" height="842" fill="#fff"/>

  <g fill="none" stroke="#334155" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter">
    <!-- 总线：竖线穿过 A、B 最左端（x=39），上下各延伸一段，表示 A、B 来自同一根总线 -->
    <path d="M 39 260 V 650"/>

    <!-- A 总线 -->
    <path d="M 39 313 H 1087" marker-end="url(#arrow)"/>

    <!-- B 原码与反码支路 -->
    <path d="M 39 597 H 541" marker-end="url(#arrow)"/>
    <path d="M 139 597 V 678 H 220"/>
    <path d="M 220 658 L 220 698 L 280 678 Z"/>
    <circle cx="290" cy="678" r="10" fill="#fff"/>
    <path d="M 300 678 H 541" marker-end="url(#arrow)"/>

    <!-- 多路选择器 -->
    <path d="M 543 516 L 706 559 V 717 L 543 760 Z" fill="#ecfeff" stroke="#0f766e" stroke-width="3"/>

    <!-- MUX 到加法器 -->
    <path d="M 706 638 H 1087" stroke="#0f766e" marker-end="url(#arrow-teal)"/>

    <!-- SUB 控制 MUX -->
    <path d="M 624 53 V 516" stroke="#d97706" stroke-dasharray="16 16" marker-end="url(#arrow-amber)"/>

    <!-- SUB 同时成为 Cin -->
    <path d="M 624 172 H 1210 V 273" stroke="#d97706" marker-end="url(#arrow-amber)"/>

    <!-- 加法器 -->
    <path d="M 1089 234 L 1332 313 V 638 L 1089 719 V 516 L 1129 476 L 1089 436 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>

    <!-- 标志位与结果输出 -->
    <path d="M 1332 354 H 1654" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
    <path d="M 1332 414 H 1654" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
    <path d="M 1332 475 H 1874" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
    <path d="M 1332 535 H 1654" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
    <path d="M 1332 595 H 1654" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
    <path d="M 1210 678 V 799" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  </g>

  <g fill="#0f172a" font-family="Arial, Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="42" font-weight="400">
    <text x="60" y="440" fill="#475569" font-weight="600">总线</text>
    <text x="84" y="288">A</text>
    <text x="84" y="571">B</text>
    <text x="536" y="66" fill="#b45309" font-weight="600">Sub</text>

    <text x="551" y="608" fill="#0f766e" font-weight="600">0</text>
    <text x="551" y="690" fill="#0f766e" font-weight="600">1</text>
    <text x="306" y="752">B̅</text>

    <text x="1250" y="207" fill="#b45309" font-weight="600">Cin</text>
    <text x="1238" y="812" fill="#1d4ed8" font-weight="600">Cout</text>

    <text x="1680" y="369" fill="#1d4ed8" font-weight="600">ZF</text>
    <text x="1680" y="429" fill="#1d4ed8" font-weight="600">OF</text>
    <text x="1906" y="490" fill="#1d4ed8" font-weight="600">F</text>
    <text x="1680" y="550" fill="#1d4ed8" font-weight="600">SF</text>
    <text x="1680" y="610" fill="#1d4ed8" font-weight="600">CF</text>
  </g>

  <g font-family="Arial, Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="42" font-weight="600" text-anchor="middle">
    <text x="625" y="638" fill="#0f766e" transform="rotate(-90 625 638)">MUX</text>
    <text x="1210" y="476" fill="#1d4ed8" transform="rotate(-90 1210 476)">加法器</text>
  </g>
</svg>
